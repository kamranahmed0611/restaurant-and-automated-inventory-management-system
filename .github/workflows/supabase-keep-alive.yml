name: Supabase Free-Tier Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qoeapcxyupyugqrmjcnp.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_mLPEexIYJiYvLYUaBSf4Vw_eBJwya-d' }}
        run: |
          echo "Pinging $SUPABASE_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Supabase responded successfully (HTTP 200)."
            exit 0
          else
            echo "❌ Keep-alive failed! HTTP Status: $HTTP_STATUS"
            exit 1
          fi

