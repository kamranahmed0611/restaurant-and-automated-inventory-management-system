name: Enterprise CI Pipeline

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Type Checking
      run: npx tsc --noEmit

    - name: Code Linting
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test --if-present

    - name: Next.js Production Build
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qoeapcxyupyugqrmjcnp.supabase.co' }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_mLPEexIYJiYvLYUaBSf4Vw_eBJwya-d' }}
        NEXT_PUBLIC_ADMIN_ONLY: 'true'
        NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: next-build
        path: .next/
